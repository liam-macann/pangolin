name: Unit testing

on:
  push:
  pull_request:
  repository_dispatch:
    types:
      - "vercel.deployment.ready"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || github.sha }}
      - name: Setup nub
        uses: nubjs/setup-nub@v0
      - name: Install dependencies
        run: nub ci
      - name: Install Playwright Browsers
        run: nub exec playwright install --with-deps
      - name: Run tests
        run: nub run test:run
      - name: "Notify Vercel"
        if: always()
        uses: "vercel/repository-dispatch/actions/status@v1"
        with:
          name: "Unit test"
