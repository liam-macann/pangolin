name: OpenAPI specification linting

on:
  push:
  pull_request:
  repository_dispatch:
    types:
      - "vercel.deployment.ready"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || github.sha }}
      - name: Setup nub
        uses: nubjs/setup-nub@v0
      - name: Install dependencies
        run: nub ci
      - name: Generate OpenAPI document
        run: nub run openapi:generate
      - name: Lint OpenAPI document
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: "openapi.json"
      - name: "Notify Vercel"
        if: always()
        uses: "vercel/repository-dispatch/actions/status@v1"
        with:
          name: "OpenAPI lint"
